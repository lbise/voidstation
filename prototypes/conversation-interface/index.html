<body>
  <div class="app" id="app"></div>
  <p class="sr-only" id="copy-status" aria-live="polite"></p>
  <dialog class="drawer-dialog" id="conversation-drawer" aria-labelledby="drawer-title">
    <div class="drawer-dialog__body">
      <div class="drawer-dialog__head"><strong class="wordmark" id="drawer-title">Voidstation</strong><button class="icon-button" id="close-drawer" type="button" aria-label="Close Conversations" title="Close Conversations"></button></div>
      <button class="button button--accent" type="button" data-new>New Conversation</button>
      <div class="search-field"><label for="drawer-search">Search Conversations</label><input id="drawer-search" data-search type="search" autocomplete="off" placeholder="Find a Conversation"></div>
      <section class="recent-group"><span class="eyebrow">Recent Conversations</span><div class="conversation-list" id="drawer-list"></div></section>
    </div>
  </dialog>
  <dialog class="palette-dialog" id="palette-dialog" aria-labelledby="palette-title">
    <div class="dialog-head"><div><h2 id="palette-title">Palette</h2><p>Prototype accent only.</p></div><button class="icon-button" id="close-palette" type="button" aria-label="Close palette" title="Close palette"></button></div>
    <div class="palette-options" id="palette-options"></div>
  </dialog>
  <dialog class="skills-dialog" id="skills-dialog" aria-labelledby="skills-title" aria-describedby="skills-description">
    <div class="dialog-head"><h2 id="skills-title">Skills</h2><button class="icon-button" id="close-skills" type="button" aria-label="Close Skills" title="Close Skills"></button></div>
    <p id="skills-description">Only one built-in Skill is available in this prototype. Runtime details are still being decided.</p>
    <form class="skills-form"><label class="skill-check"><input id="proof-skill" type="checkbox" checked><span><strong>proof</strong><small>Built-in Skill</small></span></label><output class="skill-status" id="proof-status">proof is enabled</output></form>
    <div class="skills-dialog__foot"><button class="button" id="skills-done" type="button">Done</button></div>
  </dialog>
  <dialog class="composer-sheet" id="composer-sheet" aria-labelledby="sheet-title"></dialog>
  <nav class="switcher" aria-label="Prototype switcher">
    <button id="previous-variant" type="button" aria-label="Previous variant" title="Previous variant"></button>
    <output class="switcher__label" id="switcher-label" aria-live="polite"></output>
    <button id="open-palette" type="button" aria-label="Choose palette" title="Choose palette"></button>
    <button id="next-variant" type="button" aria-label="Next variant" title="Next variant"></button>
  </nav>

  <script>

      settings: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
      attach: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 12 6.5-6.5a3.5 3.5 0 1 1 5 5L11 19a5 5 0 0 1-7-7l8-8"/></svg>',
      copy: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>',
      check: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>'
    };
    const variants = { A: 'A Docked', B: 'B Compact', C: 'C Sheet' };
    const palettes = [
      { id: 'mint', name: 'Mint', hex: '#06d6a0' }, { id: 'deep-teal', name: 'Deep teal', hex: '#14b8a6' },
      { id: 'seafoam', name: 'Seafoam', hex: '#5eead4' }, { id: 'cyan', name: 'Cyan', hex: '#22d3ee' },
      { id: 'amber', name: 'Amber', hex: '#f2b84b' }, { id: 'coral', name: 'Coral', hex: '#ff6b6b' }
    ];
    const conversations = [
      { id: 'release-notes', title: 'Review release notes', time: 'Today', excerpt: 'Keep the deployment note short.', messages: [{ role: 'User', text: 'Can you turn these release notes into a short deployment summary?' }, { role: 'Assistant', text: 'I can help shape it. Put the user-visible change first, then name any action an engineer needs to take.' }] },
      { id: 'skill-scope', title: 'Sketch a Skill boundary', time: 'Yesterday', excerpt: 'Start from the one repeated job.', messages: [{ role: 'User', text: 'Where should a new Skill begin and end?' }, { role: 'Assistant', text: 'Start with one repeated job. Keep the Skill responsible for the work it can explain without making the Conversation carry hidden setup.' }] },
      { id: 'incident', title: 'Triage an incident note', time: 'Mon', excerpt: 'Separate observed facts from guesses.', messages: [{ role: 'User', text: 'What is the first pass for an incident note?' }, { role: 'Assistant', text: 'Write observed facts in time order. Put open questions in their own section so the next person can tell them apart from evidence.' }] }
    ];
    const query = new URLSearchParams(location.search);
    const state = { currentId: 'release-notes', draft: '', search: '', waiting: false, actionTray: false, model: 'Auto', reasoning: 'Instant', proofSkillEnabled: true, attachmentName: '', drawerInvoker: null, sheetInvoker: null, skillsReturnId: null };
    let variant = Object.hasOwn(variants, query.get('variant')) ? query.get('variant') : 'A';
    let accent = palettes.some(item => item.id === query.get('accent')) ? query.get('accent') : 'mint';
    const app = document.getElementById('app');
    const drawer = document.getElementById('conversation-drawer');
    const paletteDialog = document.getElementById('palette-dialog');
    const skillsDialog = document.getElementById('skills-dialog');
    const composerSheet = document.getElementById('composer-sheet');

    function escapeHtml(value) { return value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]); }
    function currentConversation() { return conversations.find(item => item.id === state.currentId) || null; }
    function paletteName() { return palettes.find(item => item.id === accent).name; }
    function skillsSummary() { return state.proofSkillEnabled ? 'Skills · 1 enabled' : 'Skills · Off'; }
    function updateUrl() { const params = new URLSearchParams(); params.set('variant', variant); params.set('accent', accent); history.replaceState(null, '', `${location.pathname}?${params.toString()}`); document.documentElement.dataset.accent = accent; }
    function filteredConversations() { const term = state.search.trim().toLowerCase(); return term ? conversations.filter(item => `${item.title} ${item.excerpt}`.toLowerCase().includes(term)) : conversations; }
    function conversationItems() { const items = filteredConversations(); if (!items.length) return '<p class="empty-list">No Conversations match this search.</p>'; return items.map(item => `<button class="conversation-item" type="button" data-select="${item.id}" aria-current="${item.id === state.currentId}"><span class="conversation-item__copy"><span class="conversation-item__title">${escapeHtml(item.title)}</span><span class="conversation-item__excerpt">${escapeHtml(item.excerpt)}</span></span><span class="conversation-item__time">${item.time}</span></button>`).join(''); }
    function messageStream() { const conversation = currentConversation(); if (!conversation) return '<section class="empty-state"><span class="eyebrow">New Conversation</span><h2>Start with the work in front of you.</h2><p>Your first message creates a Conversation. This prototype keeps nothing after reload.</p></section>'; return `<section class="messages" aria-label="${escapeHtml(conversation.title)}">${conversation.messages.map((message, index) => `<article class="message message--${message.role.toLowerCase()}"><span class="message-role">${message.role}</span><p>${escapeHtml(message.text)}</p><div class="message-actions"><button class="copy-button" type="button" data-copy="${index}" aria-label="Copy ${message.role} message" title="Copy ${message.role} message">${icons.copy}</button></div></article>`).join('')}</section>`; }
    function attachmentControl(id) { return `<input class="file-input" id="${id}" data-attachment type="file"><label class="icon-button" for="${id}" aria-label="Attach file" title="Attach file">${icons.attach}</label>`; }
    function actionMenu(id) { return `<section class="action-menu ${state.actionTray ? 'is-open' : ''}" data-action-menu aria-label="Message actions"><div class="action-choice"><label for="${id}-model">Model<small>Prototype data</small></label><select class="action-select" id="${id}-model" data-model aria-label="Model, prototype data"><option${state.model === 'Auto' ? ' selected' : ''}>Auto</option><option${state.model === 'Kimi K2' ? ' selected' : ''}>Kimi K2</option><option${state.model === 'OpenAI-compatible' ? ' selected' : ''}>OpenAI-compatible</option></select></div><div class="action-choice"><label for="${id}-reasoning">Reasoning effort<small>Prototype setting</small></label><select class="action-select" id="${id}-reasoning" data-reasoning aria-label="Reasoning effort"><option${state.reasoning === 'Instant' ? ' selected' : ''}>Instant</option><option${state.reasoning === 'Low' ? ' selected' : ''}>Low</option><option${state.reasoning === 'Medium' ? ' selected' : ''}>Medium</option><option${state.reasoning === 'High' ? ' selected' : ''}>High</option></select></div><button class="action-choice" type="button" data-open-skills><span>${skillsSummary()}<small>proof built-in Skill</small></span>${icons.right}</button></section>`; }
    function textarea(id) { return `<span class="prompt-wrap"><label class="compact-prompt-label" for="${id}">Message</label><textarea id="${id}" data-prompt name="prompt" rows="1" placeholder="Write a message">${escapeHtml(state.draft)}</textarea></span>`; }
    function sendButton() { return `<button class="send-button" type="submit" aria-label="${state.waiting ? 'Assistant is responding' : 'Send message'}" title="${state.waiting ? 'Assistant is responding' : 'Send message'}" ${state.waiting ? 'disabled' : ''}>${state.waiting ? '…' : icons.send}</button>`; }
    function helper() { return `<span class="composer-helper" aria-live="polite">${state.waiting ? 'Assistant is responding. You can keep writing.' : state.attachmentName ? `Attached: ${escapeHtml(state.attachmentName)}` : ''}</span>`; }
    function compactComposer(id) { const attachmentId = `${id}-attachment`; return `<form class="compact-composer" data-composer>${actionMenu(id)}<div class="compact-composer__row"><button class="icon-button" id="${id}-actions" data-toggle-tray type="button" aria-label="Message actions" title="Message actions" aria-expanded="${state.actionTray}">${icons.plus}</button>${attachmentControl(attachmentId)}${textarea(id)}${sendButton()}</div>${helper()}</form>`; }
    function mobileHeader(title) { return `<header class="mobile-header"><button class="icon-button" type="button" data-open-drawer aria-label="Open Conversations" title="Open Conversations">${icons.menu}</button><p class="mobile-header__title">${escapeHtml(title)}</p><button class="icon-button" type="button" data-new aria-label="New Conversation" title="New Conversation">${icons.plus}</button></header>`; }
    function mobileA() { return `<main class="mobile-view mobile-a"><div class="floating-cluster floating-cluster--left"><button class="icon-button" type="button" data-open-drawer aria-label="Open Conversations" title="Open Conversations">${icons.menu}</button><button class="icon-button" type="button" data-search-conversations aria-label="Search Conversations" title="Search Conversations">${icons.search}</button><button class="icon-button" type="button" data-new aria-label="New Conversation" title="New Conversation">${icons.plus}</button></div><div class="floating-cluster floating-cluster--right"><button class="icon-button" type="button" data-open-palette aria-label="Open prototype palette" title="Open prototype palette">${icons.settings}</button></div>${messageStream()}${compactComposer('mobile-a-prompt')}</main>`; }
    function mobileB() { return `<main class="mobile-view mobile-b">${mobileHeader(currentConversation()?.title || 'New Conversation')}${messageStream()}${compactComposer('mobile-b-prompt')}</main>`; }
    function mobileC() { const promptLabel = state.draft || 'Start a Conversation'; return `<main class="mobile-view mobile-c">${mobileHeader(currentConversation()?.title || 'New Conversation')}${messageStream()}<button class="collapsed-prompt" data-open-sheet type="button" aria-haspopup="dialog"><span>${escapeHtml(promptLabel)}</span>${icons.plus}</button></main>`; }
    function desktopComposer() { if (variant === 'C') return `<div class="desktop-composer"><button class="collapsed-prompt" data-open-sheet type="button" aria-haspopup="dialog"><span>${escapeHtml(state.draft || 'Start a Conversation')}</span>${icons.plus}</button></div>`; return `<div class="desktop-composer">${compactComposer(`desktop-${variant.toLowerCase()}-prompt`)}</div>`; }
    function desktopShell() { return `<main class="desktop-shell"><aside class="sidebar"><div class="sidebar__head"><p class="wordmark">Voidstation</p></div><button class="button button--accent" type="button" data-new>New Conversation</button><div class="search-field"><label for="desktop-search">Search Conversations</label><input id="desktop-search" data-search type="search" autocomplete="off" placeholder="Find a Conversation" value="${escapeHtml(state.search)}"></div><section class="recent-group"><span class="eyebrow">Recent Conversations</span><div class="conversation-list" id="sidebar-list">${conversationItems()}</div></section><div class="local-user"><strong>User</strong>Local workspace</div></aside><section class="desktop-main"><header class="desktop-topline"><button class="icon-button" type="button" data-open-palette aria-label="Choose prototype palette" title="Choose prototype palette">${icons.settings}</button></header><div class="desktop-stream">${messageStream()}</div>${desktopComposer()}</section></main>`; }
    function renderSheet() { composerSheet.innerHTML = `<section class="sheet-form"><div class="dialog-head"><div><span class="eyebrow">New message</span><h2 id="sheet-title">Continue this Conversation</h2></div><button class="icon-button" type="button" data-close-sheet aria-label="Close message sheet" title="Close message sheet">${icons.close}</button></div>${compactComposer('sheet-prompt')}<button class="button button--quiet" type="button" data-close-sheet>Close</button></section>`; }
    function renderLists() { const markup = conversationItems(); const sidebarList = document.getElementById('sidebar-list'); const drawerList = document.getElementById('drawer-list'); if (sidebarList) sidebarList.innerHTML = markup; if (drawerList) drawerList.innerHTML = markup; const drawerSearch = document.getElementById('drawer-search'); if (drawerSearch) drawerSearch.value = state.search; }
    function render() { updateUrl(); app.innerHTML = `<div class="desktop-view">${desktopShell()}</div>${variant === 'A' ? mobileA() : variant === 'B' ? mobileB() : mobileC()}`; const count = currentConversation()?.messages.length || 0; document.getElementById('switcher-label').textContent = `${variants[variant]} · ${paletteName()} · ${count} messages · ${state.draft.length} draft`; document.getElementById('previous-variant').innerHTML = icons.left; document.getElementById('next-variant').innerHTML = icons.right; document.getElementById('open-palette').innerHTML = icons.settings; document.getElementById('close-drawer').innerHTML = icons.close; document.getElementById('close-palette').innerHTML = icons.close; document.getElementById('close-skills').innerHTML = icons.close; renderLists(); }
    function focusComposerIfPresent() { window.requestAnimationFrame(() => { const desktop = window.matchMedia('(min-width: 64rem)').matches; if (composerSheet.open) document.getElementById('sheet-prompt')?.focus(); else if (desktop && variant === 'C') document.querySelector('.desktop-composer [data-open-sheet]')?.focus(); else document.getElementById(desktop ? `desktop-${variant.toLowerCase()}-prompt` : `mobile-${variant.toLowerCase()}-prompt`)?.focus(); }); }
    function closeActionMenu() { if (state.actionTray) { state.actionTray = false; render(); } }
    function selectConversation(id) { state.currentId = id; state.actionTray = false; closeDrawer(); render(); focusComposerIfPresent(); }
    function newConversation() { state.currentId = null; state.draft = ''; state.actionTray = false; closeDrawer(); render(); focusComposerIfPresent(); }
    function openDrawer(invoker, focusSearch) { state.drawerInvoker = invoker; if (!drawer.open) drawer.showModal(); window.requestAnimationFrame(() => (focusSearch ? document.getElementById('drawer-search') : document.getElementById('close-drawer'))?.focus()); }
    function closeDrawer() { if (drawer.open) drawer.close(); }
    function openPalette() { if (!paletteDialog.open) paletteDialog.showModal(); renderPalette(); }
    function openSkills(invoker) { state.skillsReturnId = invoker.closest('[data-composer]')?.querySelector('[data-toggle-tray]')?.id || null; document.getElementById('proof-skill').checked = state.proofSkillEnabled; document.getElementById('proof-status').textContent = `proof is ${state.proofSkillEnabled ? 'enabled' : 'disabled'}`; if (!skillsDialog.open) skillsDialog.showModal(); window.requestAnimationFrame(() => document.getElementById('proof-skill').focus()); }
    function openSheet(invoker) { state.sheetInvoker = invoker; renderSheet(); composerSheet.showModal(); window.requestAnimationFrame(() => document.getElementById('sheet-prompt')?.focus()); }
    function closeSheet() { if (composerSheet.open) composerSheet.close(); }
    function copyMessage(button) { const message = currentConversation()?.messages[Number(button.dataset.copy)]; if (!message) return; navigator.clipboard?.writeText(message.text).catch(() => {}); button.innerHTML = icons.check; button.setAttribute('aria-label', 'Message copied'); button.setAttribute('title', 'Message copied'); document.getElementById('copy-status').textContent = 'Message copied.'; window.setTimeout(() => { button.innerHTML = icons.copy; button.setAttribute('aria-label', `Copy ${message.role} message`); button.setAttribute('title', `Copy ${message.role} message`); document.getElementById('copy-status').textContent = ''; }, 900); }
    function sendMessage() { const text = state.draft.trim(); if (!text || state.waiting) return; let conversation = currentConversation(); if (!conversation) { conversation = { id: `local-${Date.now()}`, title: text.slice(0, 44), time: 'Now', excerpt: text, messages: [] }; conversations.unshift(conversation); state.currentId = conversation.id; } conversation.messages.push({ role: 'User', text }); conversation.excerpt = text; conversation.time = 'Now'; const responseConversationId = conversation.id; state.draft = ''; state.waiting = true; const wasSheet = composerSheet.open; if (wasSheet) closeSheet(); render(); focusComposerIfPresent(); window.setTimeout(() => { const responseConversation = conversations.find(item => item.id === responseConversationId); if (responseConversation) responseConversation.messages.push({ role: 'Assistant', text: 'This is a simulated response. It has no backend or Skill execution behind it.' }); state.waiting = false; const hadEditableFocus = document.activeElement?.matches('textarea'); render(); if (hadEditableFocus) focusComposerIfPresent(); }, 480); }
    function cycleVariant(delta) { const keys = Object.keys(variants); variant = keys[(keys.indexOf(variant) + delta + keys.length) % keys.length]; state.actionTray = false; render(); }
    function renderPalette() { document.getElementById('palette-options').innerHTML = palettes.map(item => `<button class="swatch-choice" type="button" data-accent="${item.id}" aria-pressed="${item.id === accent}"><span class="swatch swatch--${item.id}" aria-hidden="true"></span><span><span class="swatch-choice__name">${item.name}</span><span class="swatch-choice__hex">${item.hex}</span></span></button>`).join(''); }

    app.addEventListener('click', event => { const target = event.target.closest('button, [data-select]'); if (!target) return; if (target.matches('[data-new]')) newConversation(); else if (target.matches('[data-select]')) selectConversation(target.dataset.select); else if (target.matches('[data-open-drawer]')) openDrawer(target, false); else if (target.matches('[data-search-conversations]')) openDrawer(target, true); else if (target.matches('[data-open-palette]')) openPalette(); else if (target.matches('[data-toggle-tray]')) { state.actionTray = !state.actionTray; render(); } else if (target.matches('[data-open-skills]')) { openSkills(target); closeActionMenu(); } else if (target.matches('[data-open-sheet]')) openSheet(target); else if (target.matches('[data-close-sheet]')) closeSheet(); else if (target.matches('[data-copy]')) copyMessage(target); });
    app.addEventListener('submit', event => { if (event.target.matches('[data-composer]')) { event.preventDefault(); sendMessage(); } });
    app.addEventListener('input', event => { if (event.target.matches('[data-prompt]')) { state.draft = event.target.value; document.getElementById('switcher-label').textContent = `${variants[variant]} · ${paletteName()} · ${currentConversation()?.messages.length || 0} messages · ${state.draft.length} draft`; } else if (event.target.matches('[data-search]')) { state.search = event.target.value; renderLists(); } });
    app.addEventListener('change', event => { if (event.target.matches('[data-model]')) { state.model = event.target.value; render(); focusComposerIfPresent(); } else if (event.target.matches('[data-reasoning]')) { state.reasoning = event.target.value; render(); focusComposerIfPresent(); } else if (event.target.matches('[data-attachment]')) { state.attachmentName = event.target.files[0]?.name || ''; render(); focusComposerIfPresent(); } });
    document.getElementById('previous-variant').addEventListener('click', () => cycleVariant(-1));
    document.getElementById('next-variant').addEventListener('click', () => cycleVariant(1));
    document.getElementById('open-palette').addEventListener('click', openPalette);
    drawer.addEventListener('click', event => { if (event.target === drawer) closeDrawer(); else if (event.target.closest('[data-new]')) newConversation(); else if (event.target.closest('[data-select]')) selectConversation(event.target.closest('[data-select]').dataset.select); });
    drawer.addEventListener('input', event => { if (event.target.matches('[data-search]')) { state.search = event.target.value; renderLists(); } });
    document.getElementById('close-drawer').addEventListener('click', closeDrawer);
    document.getElementById('close-palette').addEventListener('click', () => paletteDialog.close());
    paletteDialog.addEventListener('click', event => { if (event.target === paletteDialog) paletteDialog.close(); else if (event.target.closest('[data-accent]')) { accent = event.target.closest('[data-accent]').dataset.accent; render(); renderPalette(); } });
    document.getElementById('close-skills').addEventListener('click', () => skillsDialog.close());
    document.getElementById('skills-done').addEventListener('click', () => skillsDialog.close());
    document.getElementById('proof-skill').addEventListener('change', event => { state.proofSkillEnabled = event.target.checked; document.getElementById('proof-status').textContent = `proof is ${state.proofSkillEnabled ? 'enabled' : 'disabled'}`; });
    skillsDialog.addEventListener('click', event => { if (event.target === skillsDialog) skillsDialog.close(); });
    composerSheet.addEventListener('click', event => { if (event.target === composerSheet) closeSheet(); else if (event.target.closest('[data-close-sheet]')) closeSheet(); else if (event.target.closest('[data-toggle-tray]')) { state.actionTray = !state.actionTray; renderSheet(); } else if (event.target.closest('[data-open-skills]')) { openSkills(event.target.closest('[data-open-skills]')); closeActionMenu(); renderSheet(); } });
    composerSheet.addEventListener('submit', event => { if (event.target.matches('[data-composer]')) { event.preventDefault(); sendMessage(); } });
    composerSheet.addEventListener('input', event => { if (event.target.matches('[data-prompt]')) state.draft = event.target.value; });
    composerSheet.addEventListener('change', event => { if (event.target.matches('[data-model]')) { state.model = event.target.value; renderSheet(); } else if (event.target.matches('[data-reasoning]')) { state.reasoning = event.target.value; renderSheet(); } else if (event.target.matches('[data-attachment]')) { state.attachmentName = event.target.files[0]?.name || ''; renderSheet(); } });
    drawer.addEventListener('close', () => state.drawerInvoker?.focus());
    skillsDialog.addEventListener('close', () => { render(); document.getElementById(state.skillsReturnId)?.focus(); });
    composerSheet.addEventListener('close', () => state.sheetInvoker?.focus());
    document.addEventListener('click', event => { if (state.actionTray && !event.target.closest('[data-action-menu], [data-toggle-tray]')) closeActionMenu(); });
    document.addEventListener('keydown', event => { const editable = event.target.matches('input, textarea, select, [contenteditable]'); if (event.key === 'Escape' && state.actionTray && !drawer.open && !paletteDialog.open && !skillsDialog.open && !composerSheet.open) { event.preventDefault(); closeActionMenu(); return; } if (!editable && !drawer.open && !paletteDialog.open && !skillsDialog.open && !composerSheet.open && event.key === 'ArrowLeft') { event.preventDefault(); cycleVariant(-1); } if (!editable && !drawer.open && !paletteDialog.open && !skillsDialog.open && !composerSheet.open && event.key === 'ArrowRight') { event.preventDefault(); cycleVariant(1); } });
    render();
  </script>
</body>
</html>
