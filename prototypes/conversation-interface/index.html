    .tool-button[aria-pressed="true"] { border-color: var(--color-accent); color: var(--color-accent); }

    .mobile-a { display: grid; grid-template-rows: auto minmax(var(--space-0), 1fr) auto; min-block-size: calc(100dvh - var(--prototype-reserve)); }

    .mobile-b .messages { padding-block-end: var(--space-2); }
    .compact-composer { display: grid; gap: var(--space-2); padding: var(--space-3); border-block-start: var(--line-width) solid var(--color-line); background: var(--color-canvas-near); }
    .compact-composer__row { display: grid; grid-template-columns: auto auto minmax(var(--space-0), 1fr) auto; gap: var(--space-2); align-items: end; }
    .compact-composer textarea { min-block-size: var(--target-size); }

    .mobile-c .messages { padding-block-end: var(--space-3); }

    .switcher button { display: inline-grid; flex: 0 0 var(--target-size); inline-size: var(--target-size); place-items: center; padding: var(--space-0); border-color: var(--color-clear); border-radius: var(--radius-round); background: var(--color-clear); }
    .switcher__label { align-self: center; min-inline-size: var(--space-0); overflow: hidden; padding-inline: var(--space-1); font-size: var(--text-sm); font-weight: 600; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    dialog { color: var(--color-ink); }

<body>
  <div class="app" id="app"></div>
  <dialog class="drawer-dialog" id="conversation-drawer" aria-labelledby="drawer-title">
    <div class="drawer-dialog__body">
      <div class="drawer-dialog__head"><strong class="wordmark" id="drawer-title">Voidstation</strong><button class="icon-button" id="close-drawer" type="button" aria-label="Close Conversations"></button></div>
      <button class="button button--accent" type="button" data-new>New Conversation</button>
      <label class="search-field">Search Conversations<input id="drawer-search" data-search type="search" autocomplete="off" placeholder="Find a Conversation"></label>
      <section class="recent-group"><span class="eyebrow">Recent Conversations</span><div class="conversation-list" id="drawer-list"></div></section>
    </div>
  </dialog>
  <dialog class="palette-dialog" id="palette-dialog" aria-labelledby="palette-title">
    <div class="palette-dialog__head"><div><h2 id="palette-title">Palette</h2><p>Prototype accent only.</p></div><button class="icon-button" id="close-palette" type="button" aria-label="Close palette"></button></div>
    <div class="palette-options" id="palette-options"></div>
  </dialog>
  <dialog class="composer-sheet" id="composer-sheet" aria-labelledby="sheet-title"></dialog>
  <nav class="switcher" aria-label="Prototype switcher">
    <button id="previous-variant" type="button" aria-label="Previous variant"></button>
    <output class="switcher__label" id="switcher-label" aria-live="polite"></output>
    <button id="open-palette" type="button" aria-label="Choose palette"></button>
    <button id="next-variant" type="button" aria-label="Next variant"></button>
  </nav>

  <script>
    const icons = {
      menu: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
      close: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
      plus: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      send: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg>',
      left: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
      right: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
      settings: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>',
      attach: '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 12 6.5-6.5a3.5 3.5 0 1 1 5 5L11 19a5 5 0 0 1-7-7l8-8"/></svg>'
    };
    const variants = { A: 'A Docked', B: 'B Compact', C: 'C Sheet' };
    const palettes = [
      { id: 'mint', name: 'Mint', hex: '#06d6a0' },
      { id: 'deep-teal', name: 'Deep teal', hex: '#14b8a6' },
      { id: 'seafoam', name: 'Seafoam', hex: '#5eead4' },
      { id: 'cyan', name: 'Cyan', hex: '#22d3ee' },
      { id: 'amber', name: 'Amber', hex: '#f2b84b' },
      { id: 'coral', name: 'Coral', hex: '#ff6b6b' }
    ];
    const conversations = [
      { id: 'release-notes', title: 'Review release notes', time: 'Today', excerpt: 'Keep the deployment note short.', messages: [
        { role: 'User', text: 'Can you turn these release notes into a short deployment summary?' },
        { role: 'Assistant', text: 'I can help shape it. Put the user-visible change first, then name any action an engineer needs to take.' }
      ] },
      { id: 'skill-scope', title: 'Sketch a Skill boundary', time: 'Yesterday', excerpt: 'Start from the one repeated job.', messages: [
        { role: 'User', text: 'Where should a new Skill begin and end?' },
        { role: 'Assistant', text: 'Start with one repeated job. Keep the Skill responsible for the work it can explain without making the Conversation carry hidden setup.' }
      ] },
      { id: 'incident', title: 'Triage an incident note', time: 'Mon', excerpt: 'Separate observed facts from guesses.', messages: [
        { role: 'User', text: 'What is the first pass for an incident note?' },
        { role: 'Assistant', text: 'Write observed facts in time order. Put open questions in their own section so the next person can tell them apart from evidence.' }
      ] }
    ];
    const query = new URLSearchParams(location.search);
    const state = {
      currentId: 'release-notes', draft: '', search: '', waiting: false, actionTray: false,
      web: false, skill: false, model: 'Auto', attachmentName: '', drawerInvoker: null, sheetInvoker: null
    };
    let variant = Object.hasOwn(variants, query.get('variant')) ? query.get('variant') : 'A';
    let accent = palettes.some(item => item.id === query.get('accent')) ? query.get('accent') : 'mint';
    const app = document.getElementById('app');
    const drawer = document.getElementById('conversation-drawer');
    const paletteDialog = document.getElementById('palette-dialog');
    const composerSheet = document.getElementById('composer-sheet');

    function escapeHtml(value) { return value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]); }
    function currentConversation() { return conversations.find(item => item.id === state.currentId) || null; }
    function paletteName() { return palettes.find(item => item.id === accent).name; }
    function updateUrl() {
      const params = new URLSearchParams();
      params.set('variant', variant);
      params.set('accent', accent);
      history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
      document.documentElement.dataset.accent = accent;
    }
    function filteredConversations() {
      const term = state.search.trim().toLowerCase();
      return term ? conversations.filter(item => `${item.title} ${item.excerpt}`.toLowerCase().includes(term)) : conversations;
    }
    function conversationItems() {
      const items = filteredConversations();
      if (!items.length) return '<p class="empty-list">No Conversations match this search.</p>';
      return items.map(item => `<button class="conversation-item" type="button" data-select="${item.id}" aria-current="${item.id === state.currentId}"><span class="conversation-item__copy"><span class="conversation-item__title">${escapeHtml(item.title)}</span><span class="conversation-item__excerpt">${escapeHtml(item.excerpt)}</span></span><span class="conversation-item__time">${item.time}</span></button>`).join('');
    }
    function messageStream() {
      const conversation = currentConversation();
      if (!conversation) return '<section class="empty-state"><span class="eyebrow">New Conversation</span><h2>Start with the work in front of you.</h2><p>Your first message creates a Conversation. This prototype keeps nothing after reload.</p></section>';
      return `<section class="messages" aria-label="${escapeHtml(conversation.title)}">${conversation.messages.map((message, index) => `<article class="message message--${message.role.toLowerCase()}"><span class="message-role">${message.role}</span><p>${escapeHtml(message.text)}</p><div class="message-actions"><button class="copy-button" type="button" data-copy="${index}" aria-label="Copy ${message.role} message">Copy</button></div></article>`).join('')}</section>`;
    }
    function modelControl() {
      return `<label class="control-label">Model, prototype data<select class="model-select" data-model aria-label="Model, prototype data"><option${state.model === 'Auto' ? ' selected' : ''}>Auto</option><option${state.model === 'Kimi K2' ? ' selected' : ''}>Kimi K2</option><option${state.model === 'OpenAI-compatible' ? ' selected' : ''}>OpenAI-compatible</option></select></label>`;
    }
    function controls() {
      const attachText = state.attachmentName ? escapeHtml(state.attachmentName) : 'Attach';
      return `${modelControl()}<button class="tool-button" type="button" data-tool="web" aria-pressed="${state.web}">Web ${state.web ? 'on' : 'off'}</button><button class="tool-button" type="button" data-tool="skill" aria-pressed="${state.skill}">Skill ${state.skill ? 'on' : 'off'}</button><label class="file-label">${icons.attach}<span>${attachText}</span><input class="file-input" data-attachment type="file"></label>`;
    }
    function textarea(id) { return `<textarea id="${id}" data-prompt name="prompt" rows="1" placeholder="Write a message">${escapeHtml(state.draft)}</textarea>`; }
    function sendButton() { return `<button class="send-button" type="submit" aria-label="${state.waiting ? 'Assistant is responding' : 'Send message'}" ${state.waiting ? 'disabled' : ''}>${state.waiting ? '…' : icons.send}</button>`; }
    function helper() { return `<span class="composer__helper" aria-live="polite">${state.waiting ? 'Assistant is responding. You can keep writing.' : 'Files stay local to this prototype.'}</span>`; }
    function dockedComposer(id) { return `<form class="composer" data-composer><label class="composer__label" for="${id}">Message</label><div class="composer__entry">${textarea(id)}${sendButton()}</div><div class="composer__controls">${controls()}</div>${helper()}</form>`; }
    function compactComposer(id) { return `<form class="compact-composer" data-composer><div class="compact-composer__row"><button class="icon-button" data-toggle-tray type="button" aria-label="Show message actions" aria-expanded="${state.actionTray}">${icons.plus}</button><label class="compact-prompt-label" for="${id}">Message</label>${textarea(id)}${sendButton()}</div>${helper()}</form>`; }
    function mobileHeader(title) { return `<header class="mobile-header"><button class="icon-button" type="button" data-open-drawer aria-label="Open Conversations">${icons.menu}</button><p class="mobile-header__title">${escapeHtml(title)}</p><button class="icon-button" type="button" data-new aria-label="New Conversation">${icons.plus}</button></header>`; }
    function mobileA() { return `<main class="mobile-view mobile-a">${mobileHeader(currentConversation()?.title || 'New Conversation')}${messageStream()}${dockedComposer('mobile-a-prompt')}</main>`; }
    function mobileB() { return `<main class="mobile-view mobile-b">${mobileHeader(currentConversation()?.title || 'New Conversation')}${messageStream()}<div class="action-tray ${state.actionTray ? 'is-open' : ''}" aria-label="Message actions">${controls()}</div>${compactComposer('mobile-b-prompt')}</main>`; }
    function mobileC() { const promptLabel = state.draft || 'Start a Conversation'; return `<main class="mobile-view mobile-c">${mobileHeader(currentConversation()?.title || 'New Conversation')}${messageStream()}<button class="collapsed-prompt" data-open-sheet type="button" aria-haspopup="dialog"><span>${escapeHtml(promptLabel)}</span>${icons.plus}</button></main>`; }
    function desktopComposer() {
      if (variant === 'B') return `<div class="desktop-composer desktop-composer--compact"><div class="action-tray ${state.actionTray ? 'is-open' : ''}" aria-label="Message actions">${controls()}</div>${compactComposer('desktop-b-prompt')}</div>`;
      if (variant === 'C') return `<div class="desktop-composer desktop-composer--sheet"><span class="composer__label">Message</span><button class="collapsed-prompt" data-open-sheet type="button" aria-haspopup="dialog"><span>${escapeHtml(state.draft || 'Start a Conversation')}</span>${icons.plus}</button></div>`;
      return `<div class="desktop-composer">${dockedComposer('desktop-prompt')}</div>`;
    }
    function desktopShell() { return `<main class="desktop-shell"><aside class="sidebar"><div class="sidebar__head"><p class="wordmark">Voidstation</p></div><button class="button button--accent" type="button" data-new>New Conversation</button><label class="search-field">Search Conversations<input data-search type="search" autocomplete="off" placeholder="Find a Conversation" value="${escapeHtml(state.search)}"></label><section class="recent-group"><span class="eyebrow">Recent Conversations</span><div class="conversation-list" id="sidebar-list">${conversationItems()}</div></section><div class="local-user"><strong>User</strong>Local workspace</div></aside><section class="desktop-main"><header class="desktop-topline"><button class="icon-button" type="button" data-open-palette aria-label="Choose prototype palette">${icons.settings}</button></header><div class="desktop-stream">${messageStream()}</div>${desktopComposer()}</section></main>`; }
    function renderSheet() { composerSheet.innerHTML = `<section class="sheet-form"><div class="sheet-form__head"><div><span class="eyebrow">New message</span><h2 id="sheet-title">Continue this Conversation</h2></div><button class="icon-button" type="button" data-close-sheet aria-label="Close message sheet">${icons.close}</button></div>${dockedComposer('sheet-prompt')}<button class="button button--quiet" type="button" data-close-sheet>Close</button></section>`; }
    function render() {
      updateUrl();
      app.innerHTML = `<div class="desktop-view">${desktopShell()}</div>${variant === 'A' ? mobileA() : variant === 'B' ? mobileB() : mobileC()}`;
      const messageCount = currentConversation()?.messages.length || 0;
      document.getElementById('switcher-label').textContent = `${variants[variant]} · ${paletteName()} · ${messageCount} messages · ${state.draft.length} draft`;
      document.getElementById('previous-variant').innerHTML = icons.left;
      document.getElementById('next-variant').innerHTML = icons.right;
      document.getElementById('open-palette').innerHTML = icons.settings;
      document.getElementById('close-drawer').innerHTML = icons.close;
      document.getElementById('close-palette').innerHTML = icons.close;
      renderLists();
      bindDynamicEvents(app);
    }
    function renderLists() {
      const markup = conversationItems();
      const sidebarList = document.getElementById('sidebar-list');
      const drawerList = document.getElementById('drawer-list');
      if (sidebarList) sidebarList.innerHTML = markup;
      if (drawerList) drawerList.innerHTML = markup;
      const drawerSearch = document.getElementById('drawer-search');
      if (drawerSearch) drawerSearch.value = state.search;
      bindListEvents();
    }
    function bindListEvents() {
      document.querySelectorAll('[data-select]').forEach(button => button.addEventListener('click', () => selectConversation(button.dataset.select)));
      document.querySelectorAll('[data-search]').forEach(input => { input.oninput = event => { state.search = event.target.value; renderLists(); }; });
    }
    function bindDynamicEvents(root) {
      root.querySelectorAll('[data-new]').forEach(button => button.addEventListener('click', newConversation));
      root.querySelectorAll('[data-open-drawer]').forEach(button => button.addEventListener('click', () => openDrawer(button)));
      root.querySelectorAll('[data-open-palette]').forEach(button => button.addEventListener('click', () => { openPalette(); renderPalette(); }));
      root.querySelectorAll('[data-composer]').forEach(form => form.addEventListener('submit', event => { event.preventDefault(); sendMessage(); }));
      root.querySelectorAll('[data-toggle-tray]').forEach(button => button.addEventListener('click', () => { state.actionTray = !state.actionTray; render(); }));
      root.querySelectorAll('[data-open-sheet]').forEach(button => button.addEventListener('click', () => openSheet(button)));
      root.querySelectorAll('[data-close-sheet]').forEach(button => button.addEventListener('click', closeSheet));
      root.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => copyMessage(button)));
      root.querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click', () => { state[button.dataset.tool] = !state[button.dataset.tool]; render(); focusComposerIfPresent(); }));
      root.querySelectorAll('[data-model]').forEach(select => select.addEventListener('change', event => { state.model = event.target.value; render(); focusComposerIfPresent(); }));
      root.querySelectorAll('[data-attachment]').forEach(input => input.addEventListener('change', event => { state.attachmentName = event.target.files[0]?.name || ''; render(); focusComposerIfPresent(); }));
      root.querySelectorAll('[data-prompt]').forEach(input => input.addEventListener('input', event => { state.draft = event.target.value; document.getElementById('switcher-label').textContent = `${variants[variant]} · ${paletteName()} · ${currentConversation()?.messages.length || 0} messages · ${state.draft.length} draft`; }));
    }
    function focusComposerIfPresent() { window.requestAnimationFrame(() => { const desktop = window.matchMedia('(min-width: 64rem)').matches; if (composerSheet.open) document.getElementById('sheet-prompt')?.focus(); else if (desktop && variant === 'C') document.querySelector('.desktop-composer--sheet [data-open-sheet]')?.focus(); else { const id = desktop ? variant === 'B' ? 'desktop-b-prompt' : 'desktop-prompt' : variant === 'A' ? 'mobile-a-prompt' : 'mobile-b-prompt'; document.getElementById(id)?.focus(); } }); }
    function selectConversation(id) { state.currentId = id; state.actionTray = false; closeDrawer(); render(); focusComposerIfPresent(); }
    function newConversation() { state.currentId = null; state.draft = ''; state.actionTray = false; closeDrawer(); render(); focusComposerIfPresent(); }
    function openDrawer(invoker) { state.drawerInvoker = invoker; if (!drawer.open) drawer.showModal(); window.requestAnimationFrame(() => document.getElementById('drawer-search').focus()); }
    function closeDrawer() { if (drawer.open) drawer.close(); }
    function openPalette() { if (!paletteDialog.open) paletteDialog.showModal(); }
    function openSheet(invoker) { state.sheetInvoker = invoker; renderSheet(); bindDynamicEvents(composerSheet); composerSheet.showModal(); window.requestAnimationFrame(() => document.getElementById('sheet-prompt')?.focus()); }
    function closeSheet() { if (composerSheet.open) composerSheet.close(); }
    function copyMessage(button) {
      const conversation = currentConversation();
      const message = conversation?.messages[Number(button.dataset.copy)];
      if (!message) return;
      navigator.clipboard?.writeText(message.text).catch(() => {});
      button.textContent = 'Copied';
      button.setAttribute('aria-label', 'Copied message');
      window.setTimeout(() => { button.textContent = 'Copy'; button.setAttribute('aria-label', `Copy ${message.role} message`); }, 900);
    }
    function sendMessage() {
      const text = state.draft.trim();
      if (!text || state.waiting) return;
      let conversation = currentConversation();
      if (!conversation) {
        conversation = { id: `local-${Date.now()}`, title: text.slice(0, 44), time: 'Now', excerpt: text, messages: [] };
        conversations.unshift(conversation);
        state.currentId = conversation.id;
      }
      conversation.messages.push({ role: 'User', text });
      conversation.excerpt = text;
      conversation.time = 'Now';
      const responseConversationId = conversation.id;
      state.draft = '';
      state.waiting = true;
      const wasSheet = composerSheet.open;
      if (wasSheet) closeSheet();
      render();
      focusComposerIfPresent();
      window.setTimeout(() => {
        const responseConversation = conversations.find(item => item.id === responseConversationId);
        if (responseConversation) responseConversation.messages.push({ role: 'Assistant', text: 'This is a simulated response. It has no backend or Skill execution behind it.' });
        state.waiting = false;
        const hadEditableFocus = document.activeElement?.matches('textarea');
        render();
        if (hadEditableFocus) focusComposerIfPresent();
      }, 480);
    }
    function cycleVariant(delta) { const keys = Object.keys(variants); variant = keys[(keys.indexOf(variant) + delta + keys.length) % keys.length]; state.actionTray = false; render(); }
    function renderPalette() { document.getElementById('palette-options').innerHTML = palettes.map(item => `<button class="swatch-choice" type="button" data-accent="${item.id}" aria-pressed="${item.id === accent}"><span class="swatch swatch--${item.id}" aria-hidden="true"></span><span><span class="swatch-choice__name">${item.name}</span><span class="swatch-choice__hex">${item.hex}</span></span></button>`).join(''); document.querySelectorAll('#palette-options [data-accent]').forEach(button => button.addEventListener('click', () => { accent = button.dataset.accent; render(); renderPalette(); })); }
    document.getElementById('previous-variant').addEventListener('click', () => cycleVariant(-1));
    document.getElementById('next-variant').addEventListener('click', () => cycleVariant(1));
    document.getElementById('open-palette').addEventListener('click', () => { openPalette(); renderPalette(); });
    drawer.querySelector('[data-new]').addEventListener('click', newConversation);
    document.getElementById('close-drawer').addEventListener('click', closeDrawer);
    document.getElementById('close-palette').addEventListener('click', () => paletteDialog.close());
    drawer.addEventListener('close', () => state.drawerInvoker?.focus());
    composerSheet.addEventListener('close', () => state.sheetInvoker?.focus());
    drawer.addEventListener('click', event => { if (event.target === drawer) closeDrawer(); });
    paletteDialog.addEventListener('click', event => { if (event.target === paletteDialog) paletteDialog.close(); });
    composerSheet.addEventListener('click', event => { if (event.target === composerSheet) closeSheet(); });
    document.addEventListener('keydown', event => {
      const editable = event.target.matches('input, textarea, select, [contenteditable]');
      if (!editable && !drawer.open && !paletteDialog.open && !composerSheet.open && event.key === 'ArrowLeft') { event.preventDefault(); cycleVariant(-1); }
      if (!editable && !drawer.open && !paletteDialog.open && !composerSheet.open && event.key === 'ArrowRight') { event.preventDefault(); cycleVariant(1); }
    });
    render();
  </script>
</body>
</html>
